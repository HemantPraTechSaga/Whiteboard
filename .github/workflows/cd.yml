# .github/workflows/cd.yml
name: CD - Deploy Whiteboard to Local Vagrant

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted  # <-- your Vagrant box runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Navigate to Docker Compose directory
        working-directory: /my-docker-setup
        run: docker compose down
      
      - name: Rebuild and restart whiteboard container
        working-directory: /my-docker-setup
        run: docker compose up -d --build whiteboard-server

